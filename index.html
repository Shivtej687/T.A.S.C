<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midnight Void</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" referrerpolicy="no-referrer"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'grid-scroll': 'grid-scroll 10s linear infinite',
              'ripple': 'ripple 3s cubic-bezier(0.4, 0, 0.2, 1) infinite',
              'spin-slow': 'spin-clockwise 20s linear infinite',
              'spin-medium': 'spin-clockwise 12s linear infinite',
              'spin-slower': 'spin-clockwise 40s linear infinite',
              'spin-reverse-slow': 'spin-counter-clockwise 25s linear infinite',
              'spin-reverse-slower': 'spin-counter-clockwise 50s linear infinite',
              'scan': 'scan 2s linear infinite',
            },
            keyframes: {
              'scan': {
                '0%': { top: '0%', opacity: '0.8' },
                '50%': { opacity: '1' },
                '100%': { top: '100%', opacity: '0.8' }
              },
              'shimmer': {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(300%)' }
              },
              'grid-scroll': {
                '0%': { backgroundPosition: '0 0' },
                '100%': { backgroundPosition: '40px 40px' }
              },
              'ripple': {
                '0%': { transform: 'scale(1)', opacity: '0.4' },
                '100%': { transform: 'scale(1.6)', opacity: '0' }
              },
              'spin-clockwise': {
                'from': { transform: 'rotate(0deg)' },
                'to': { transform: 'rotate(360deg)' }
              },
              'spin-counter-clockwise': {
                'from': { transform: 'rotate(360deg)' },
                'to': { transform: 'rotate(0deg)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #050a14;
        font-family: 'Inter', sans-serif;
      }
      
      /* Grid Pattern Configuration */
      .bg-grid {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-repeat: repeat;
      }

      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      
      /* Custom Cyber Scrollbar for Biometric Lab & Modals */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #030914;
        border-radius: 4px;
        border: 1px solid rgba(6, 182, 212, 0.15);
      }
      ::-webkit-scrollbar-thumb {
        background: #0891b2;
        border: 1px solid #22d3ee;
        border-radius: 4px;
        box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #06b6d4;
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.8);
      }

      /* Firefox scrollbar support */
      * {
        scrollbar-width: thin;
        scrollbar-color: #0891b2 #030914;
      }

      /* Hide Scrollbar but keep functionality */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Custom Leaflet Marker Pulse */
      .threat-icon {
        background: transparent;
        border: none;
      }
      .pulse-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.2);
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .pulse-core {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 12px;
        background: #ef4444;
        border: 2px solid white;
        border-radius: 50%;
        box-shadow: 0 0 10px #ef4444;
      }
      .pulse-ring-deployed {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.25);
        animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .pulse-core-deployed {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 14px;
        height: 14px;
        background: #10b981;
        border: 2px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 12px #10b981;
      }

      /* 3D Tactical Label Style */
      .tactical-label {
        color: #00ffff;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(0, 255, 255, 0.5);
        padding: 4px 8px;
        pointer-events: none; /* Allows clicking through to the 3D model */
        text-shadow: 0 0 5px cyan;
        border-radius: 2px;
        white-space: nowrap;
      }

      @keyframes ping {
        75%, 100% {
          transform: translate(-50%, -50%) scale(2);
          opacity: 0;
        }
      }

      /* Leaflet overrides for dark mode feel */
      .leaflet-control-attribution {
        background: rgba(0,0,0,0.5) !important;
        color: #aaa !important;
      }
      .leaflet-control-attribution a {
        color: #67e8f9 !important;
      }

      /* Print Styles for PDF Generation */
      @media print {
        @page {
          margin: 1.5cm;
          size: auto;
        }

        body {
          background-color: white !important;
          color: black !important;
          height: auto !important;
          overflow: visible !important;
        }

        /* Hide all non-essential UI elements */
        .print\:hidden,
        .bg-grid, 
        canvas, 
        button, 
        input, 
        form,
        .fixed,
        .absolute:not(#printable-area *) {
          display: none !important;
        }

        /* Ensure the printable area is visible and styled for paper */
        #printable-area {
          display: block !important;
          position: static !important;
          width: 100% !important;
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
          background: white !important;
          color: black !important;
          overflow: visible !important;
        }

        /* Override Prose Invert (Dark Mode text) for Print */
        .prose-invert {
          --tw-prose-body: #000 !important;
          --tw-prose-headings: #000 !important;
          --tw-prose-lead: #000 !important;
          --tw-prose-links: #000 !important;
          --tw-prose-bold: #000 !important;
          --tw-prose-counters: #000 !important;
          --tw-prose-bullets: #000 !important;
          --tw-prose-hr: #ccc !important;
          --tw-prose-quotes: #000 !important;
          --tw-prose-quote-borders: #ccc !important;
          --tw-prose-captions: #000 !important;
          --tw-prose-code: #000 !important;
          --tw-prose-pre-code: #000 !important;
          --tw-prose-pre-bg: #f5f5f5 !important;
          --tw-prose-th-borders: #000 !important;
          --tw-prose-td-borders: #000 !important;
        }

        /* Reset specific element styling */
        .text-cyan-400, .text-cyan-300, .text-cyan-100\/80 {
          color: black !important;
          text-shadow: none !important;
        }
        
        .border-cyan-500\/20, .border-cyan-500\/10 {
          border-color: #ddd !important;
        }

        a {
          text-decoration: underline;
          color: blue !important;
        }
      }
      
      /* Specific override for html2pdf to ensure white background */
      .pdf-export-container {
         background-color: white !important;
         color: black !important;
      }
      .pdf-export-container * {
         color: black !important;
         text-shadow: none !important;
      }
    </style>

{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",

  }
}
</script>
